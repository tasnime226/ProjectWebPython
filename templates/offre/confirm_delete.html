<h1>Confirmation de suppression</h1>

<p>
    Êtes-vous sûr de vouloir supprimer cette offre ?
</p>

<p>Prix : {{ object.prix }}</p>

<form method="POST">
    {% csrf_token %}

    <button type="submit" style="color: red;">
        Confirmer la suppression
    </button>

    <a href="{% url 'offre:offre_list' %}">
        Annuler
    </a>
</form>
