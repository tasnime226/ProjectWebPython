
<h1>Confirmation de suppression</h1>

<p>
    Êtes-vous sûr de vouloir supprimer l'entreprise
    {{ object.raison_sociale }} ?
</p>

<form method="POST">
    {% csrf_token %}

    <button type="submit" style="color: red;">
        Confirmer la suppression
    </button>

    <a href="{% url 'entreprise:entreprise_list' %}">
        Annuler
    </a>
</form>
