<p>
    Êtes-vous sûr de vouloir supprimer cette expédition
    {{ object.reference }} ?
</p>

<form method="post">
    {% csrf_token %}

    <button type="submit" style="color: red;">
        Confirmer la suppression
    </button>

    <a href="{% url 'expedition:list' %}">
        Annuler
    </a>
</form>
